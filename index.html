  <style>
    @font-face {
      font-family: "Minecraft";
      src: url("Minecraft.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    :root {
      color-scheme: dark;
      --room: #010201;
      --glass-top: #113619;
      --glass-bottom: #041006;
      --phosphor: #8df7a3;
      --phosphor-glow: rgba(141, 247, 163, 0.55);
      --phosphor-dim: rgba(95, 236, 125, 0.25);
      --scanline: rgba(150, 255, 168, 0.08);
      --vignette: rgba(0, 0, 0, 0.42);
      --offset-x: 6vw;
      --title-scale: 1.2;
      --title-shift-x: -4vw;
      --character-shift-x: -1vw;
      --character-shift-y: -15vw;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: var(--room);
      overflow: hidden;
    }

    .crt {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 30%, rgba(49, 255, 110, 0.15), transparent 34%),
        radial-gradient(circle at 50% 50%, rgba(141, 247, 163, 0.05), transparent 64%),
        linear-gradient(180deg, var(--glass-top) 0%, var(--glass-bottom) 100%);
      box-shadow:
        inset 0 0 42px rgba(116, 255, 150, 0.08),
        inset 0 0 140px rgba(0, 0, 0, 0.60);
      overflow: hidden;
    }

    .crt::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          180deg,
          var(--scanline) 0 1px,
          rgba(0, 0, 0, 0.08) 1px 3px
        ),
        linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.18) 0,
          transparent 8%,
          transparent 92%,
          rgba(0, 0, 0, 0.18) 100%
        );
      opacity: 0.58;
      pointer-events: none;
      z-index: 2;
    }

    .crt::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center, transparent 54%, var(--vignette) 100%),
        linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.05),
          transparent 16%,
          transparent 84%,
          rgba(0, 0, 0, 0.15)
        );
      pointer-events: none;
      z-index: 3;
    }

    .stage {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 1.8vh, 22px);
      transform: translateX(var(--offset-x));
      animation: breathe 6s ease-in-out infinite;
      pointer-events: none;
      user-select: none;
    }

    .ascii-art {
      margin: 0;
      color: var(--phosphor);
      font-family: "Iosevka", "Menlo", "Consolas", monospace;
      font-variant-ligatures: none;
      font-feature-settings: "liga" 0, "calt" 0;
      line-height: 0.88;
      letter-spacing: 0;
      white-space: pre;
      text-shadow:
        0 0 4px var(--phosphor-glow),
        0 0 12px rgba(89, 255, 120, 0.28),
        0 0 24px var(--phosphor-dim);
      animation: flicker 120ms steps(2) infinite;
    }

    .title {
      font-size: min(calc(88vw / 104), calc(22vh / 20.24));
      transform: translateX(var(--title-shift-x)) scale(var(--title-scale));
      transform-origin: center center;
    }

    .character {
      font-size: min(calc(94vw / 80), calc(54vh / 53.68));
      transform: translate(var(--character-shift-x), var(--character-shift-y));
    }

    .intro-shell {
      position: absolute;
      left: 50%;
      bottom: clamp(108px, 14vh, 168px);
      width: min(72vw, 980px);
      padding: 1.1rem 1.25rem;
      border: 1px solid rgba(141, 247, 163, 0.18);
      background:
        linear-gradient(180deg, rgba(18, 54, 25, 0.52), rgba(4, 16, 6, 0.2)),
        rgba(0, 0, 0, 0.18);
      box-shadow:
        inset 0 0 24px rgba(141, 247, 163, 0.04),
        0 0 18px rgba(89, 255, 120, 0.07);
      transform: translateX(-50%);
      opacity: 0.92;
      animation: flicker 120ms steps(2) infinite;
      z-index: 4;
      pointer-events: none;
      user-select: none;
      overflow: hidden;
    }

    .intro-shell::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        transparent 0%,
        rgba(141, 247, 163, 0.02) 35%,
        rgba(141, 247, 163, 0.09) 50%,
        rgba(141, 247, 163, 0.02) 65%,
        transparent 100%
      );
      transform: translateY(-110%);
      animation: intro-scan 7.5s linear infinite;
      pointer-events: none;
    }

    .intro {
      position: relative;
      margin: 0;
      min-height: 8.8em;
      color: #c2ffcc;
      font-family: "Minecraft", "Iosevka", "Menlo", "Consolas", monospace;
      font-size: clamp(16px, 1.45vw, 26px);
      line-height: 1.7;
      text-align: left;
      letter-spacing: 0.015em;
      white-space: pre-wrap;
      word-break: keep-all;
      text-shadow:
        0 0 3px rgba(141, 247, 163, 0.4),
        0 0 10px rgba(89, 255, 120, 0.18);
    }

    .intro-cursor {
      display: inline-block;
      color: #d9ffdb;
      text-shadow:
        0 0 4px rgba(141, 247, 163, 0.52),
        0 0 10px rgba(89, 255, 120, 0.22);
      animation: blink 1s steps(1) infinite;
    }

    .site-footer {
      position: absolute;
      left: 50%;
      bottom: clamp(20px, 3.6vh, 40px);
      width: min(84vw, 1080px);
      margin: 0;
      color: rgba(194, 255, 204, 0.78);
      font-family: "Minecraft", "Iosevka", "Menlo", "Consolas", monospace;
      font-size: clamp(11px, 0.95vw, 16px);
      line-height: 1.7;
      letter-spacing: 0.03em;
      text-align: center;
      text-shadow:
        0 0 3px rgba(141, 247, 163, 0.28),
        0 0 10px rgba(89, 255, 120, 0.12);
      transform: translateX(-50%);
      z-index: 4;
      opacity: 0.9;
      animation: flicker 120ms steps(2) infinite;
      pointer-events: none;
      user-select: none;
    }

    .site-footer p {
      margin: 0;
    }

    @media (max-width: 720px) {
      .intro-shell {
        width: min(88vw, 980px);
        bottom: clamp(132px, 24vh, 220px);
      }

      .site-footer {
        width: min(88vw, 1080px);
        font-size: clamp(10px, 2.8vw, 14px);
      }
    }

    @keyframes flicker {
      0% { opacity: 0.96; }
      50% { opacity: 1; }
      100% { opacity: 0.97; }
    }

    @keyframes breathe {
      0%, 100% { transform: translateX(var(--offset-x)) scale(1); filter: brightness(1); }
      50% { transform: translateX(var(--offset-x)) scale(1.003); filter: brightness(1.05); }
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes intro-scan {
      0% { transform: translateY(-110%); }
      100% { transform: translateY(110%); }
    }

    );

    function pickSymbol(level, x, y, tick) {
      const safeLevel = Math.max(1, Math.min(groups.length, level));
      const symbols = groups[safeLevel - 1];
      const index = Math.floor(seed(x * 3.1 + tick, y * 5.7 + tick * 0.7) * symbols.length);
      return symbols[index];
    }

    function mutateCell(cell, x, y, tick) {
      if (!cell.level) {
        return " ";
      }

      const pulse = seed(x + tick * 0.21, y + tick * 0.13);
      if (pulse > 0.88) {
        cell.char = pickSymbol(cell.level, x, y, tick);
      } else if (pulse < 0.05 && cell.level > 1) {
        cell.char = pickSymbol(cell.level - 1, x, y, tick);
      } else if (pulse > 0.78 && cell.level < groups.length) {
        cell.char = pickSymbol(cell.level + 1, x, y, tick);
      }

      return cell.char;
    }

    function renderTitle(tick) {
      titleOutput.textContent = titleState
        .map((row, y) => row.map((cell, x) => mutateCell(cell, x, y, tick)).join(""))
        .join("\n");
    }

    let frameIndex = 0;

    function drawCharacter(index) {
      frameIndex = (index + frames.length) % frames.length;
      characterOutput.textContent = frames[frameIndex];
    }

    function scheduleCharacter() {
      const wait = durations[frameIndex] || fallbackFrameMs;
      window.setTimeout(() => {
        drawCharacter(frameIndex + 1);
        scheduleCharacter();
      }, wait);
    }

    function sleep(ms) {
      return new Promise((resolve) => window.setTimeout(resolve, ms));
    }

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function appendIntro(text) {
      introText.textContent += text;
    }

    async function typeIntro(text, minDelay, maxDelay) {
      for (const character of text) {
        appendIntro(character);
        await sleep(randomInt(minDelay, maxDelay));
      }
    }

    async function runIntro() {
      introText.textContent = "";

      for (const step of introScript) {
        if (step.type === "pause") {
          await sleep(step.ms);
          continue;
        }

        if (step.type === "command") {
          appendIntro(step.prompt);
          await typeIntro(step.text, 24, 54);
          appendIntro("\n");
          continue;
        }

        if (step.type === "line") {
          await typeIntro(step.text, 10, 24);
          appendIntro("\n");
        }
      }
    }

    let tick = 0;
    renderTitle(tick);
    drawCharacter(0);
    scheduleCharacter();
    runIntro();

    window.setInterval(() => {
      tick += 1;
      renderTitle(tick);
    }, titleTickMs);
  </script>
</body>
</html>
